name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet pytest sqlite-vec httpx
      - name: Linux search dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: macOS search and SQLite-capable embedding interpreter
        if: runner.os == 'macOS'
        run: |
          brew install ripgrep python@3.12
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$RUNNER_TEMP/raidho-embed"
          "$RUNNER_TEMP/raidho-embed/bin/python" -m pip install --quiet sqlite-vec httpx
          echo "RAIDHO_TEST_PYTHON=$RUNNER_TEMP/raidho-embed/bin/python" >> "$GITHUB_ENV"
      - name: Verify sqlite-vec loads in the test interpreter
        run: |
          "${RAIDHO_TEST_PYTHON:-python}" -c "import sqlite3, sqlite_vec; c = sqlite3.connect(':memory:'); c.enable_load_extension(True); sqlite_vec.load(c); print(c.execute('select vec_version()').fetchone()[0])"
      - run: python -m pytest --fail-on-skip

  lint-and-consistency:
    name: ruff + registry/README/release check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff
      - run: python -m ruff check .
      - run: python scripts/gen_tools_doc.py --check
      - run: python scripts/release_check.py

  coverage:
    name: coverage (soglia in pyproject)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest coverage sqlite-vec httpx
      - run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: pytest sotto coverage (sottoprocessi inclusi)
        # coverage ≥ 7 avvia process_startup() da un .pth PRIMA di sitecustomize: le variabili
        # che la config usa (${RAIDHO_COV_ROOT}) e il file dati vanno esportate esplicitamente.
        env:
          RAIDHO_COV_ROOT: ${{ github.workspace }}
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          PYTHONPATH: ${{ github.workspace }}/tests/_coverage_hook
        run: python -m coverage run -m pytest --fail-on-skip
      - run: python -m coverage combine
      - run: python -m coverage report --fail-under=${COV_MIN}
        env:
          COV_MIN: "56"   # baseline 58.7% su py3.12+sqlite-vec (2026-09-04) meno 2 punti; alzare a ogni release
